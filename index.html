<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Michele &amp; Giorgia sposi</title>
<meta name="description" content="Il nostro matrimonio, la nostra favola. Save the date: 10 Luglio 2027.">

<!--
  ============================================================
  COME MODIFICARE QUESTO SITO — leggimi prima di iniziare
  ============================================================
  1. Cerca i commenti tipo "MODIFICA QUI" in questo file, in style.css
     e in script.js: indicano i punti pensati per essere personalizzati.
  2. Le immagini vanno messe nella cartella /images con i nomi indicati
     nei commenti (es. images/hero-sposi.jpg). Finché non le carichi,
     al loro posto comparirà un'illustrazione di riserva elegante.
  3. Il video della proposta va messo in /videos/proposta.mp4
     (oppure sostituisci il tag <video> con un embed di YouTube,
     istruzioni nel commento apposito).
  4. I nomi di Michele e Giorgia sono già scritti per esteso ovunque:
     se in futuro cambia qualcosa, usa "trova e sostituisci" del tuo editor.
  5. I colori e i font si modificano tutti dalle variabili in cima a
     style.css (sezione :root), senza dover toccare il resto del CSS.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header" id="top">
  <div class="site-header__inner">
    <a class="monogram" href="index.html" aria-label="Michele e Giorgia">M<span class="monogram__amp">&amp;</span>G</a>
  </div>
</header>

<main>

  <section class="hero" id="home">
    <div class="hero__scrim" aria-hidden="true"></div>
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="hero__petals" aria-hidden="true" id="heroPetals"></div>

    <div class="hero__content">
      <p class="eyebrow eyebrow--light">Gentile Lettore,</p>
      <h1 class="hero__title">Michele <span class="amp">&amp;</span> Giorgia</h1>
      <p class="hero__script">si mormora di un lieto avvenimento</p>

      <div class="save-the-date">
        <p class="save-the-date__label">Save the date</p>
        <time class="save-the-date__date" datetime="2027-07-10">Sabato 10 Luglio 2027</time>
        <div class="save-the-date__events">
          <p><span class="ev__what">Cerimonia · ore 17:00</span><span class="ev__where">Santuario della Madonna di Belvedere</span></p>
          <p><span class="ev__what">Ricevimento · ore 19:00</span><span class="ev__where">Villa Pasqui</span></p>
          <p class="ev__city">Città di Castello (PG)</p>
        </div>
      </div>

      <div class="countdown" id="countdown" aria-live="polite">
        <div class="countdown__item"><span class="countdown__num" id="cd-days">–</span><span class="countdown__label">giorni</span></div>
        <div class="countdown__item"><span class="countdown__num" id="cd-hours">–</span><span class="countdown__label">ore</span></div>
        <div class="countdown__item"><span class="countdown__num" id="cd-mins">–</span><span class="countdown__label">minuti</span></div>
        <div class="countdown__item"><span class="countdown__num" id="cd-secs">–</span><span class="countdown__label">secondi</span></div>
      </div>

      <a class="hero-btn" href="sito.html">Continua a leggere <span class="hero-btn__arrow" aria-hidden="true">→</span></a>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
